services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: awo-ifa-web
    ports:
      - "8080:80"
    restart: unless-stopped

  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: awo-ifa-dev
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
    profiles:
      - dev
